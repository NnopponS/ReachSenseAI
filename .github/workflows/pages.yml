name: ReachSenseAI GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: python -m pip install -r scripts/feasibility/requirements.txt
      - run: npm --prefix workbench ci
      - run: node --test workbench/tests/*.test.js web/tests/core.test.mjs
      - run: python -m scripts.build_pages --output-dir site
      - name: Check staged project-path application
        env:
          REACHSENSE_BROWSER_CHANNEL: chrome
        run: node workbench/tests/pages-smoke.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete app
        id: deployment
        uses: actions/deploy-pages@v4
