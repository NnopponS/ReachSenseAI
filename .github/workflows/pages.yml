name: ReachSenseAI GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: python -m pip install -r scripts/feasibility/requirements.txt
      - run: npm --prefix workbench ci
      - run: node --test workbench/tests/*.test.js web/tests/core.test.mjs
      - run: python -m scripts.build_pages --output-dir site
      - name: Check staged project-path application
        env:
          REACHSENSE_BROWSER_CHANNEL: chrome
        shell: bash
        run: |
          set +e
          node workbench/tests/pages-smoke.mjs > /tmp/reachsense-page-test.txt 2>&1
          REACHSENSE_PAGE_CHECK_EXIT=$?
          cat /tmp/reachsense-page-test.txt
          printf '### Static Pages browser check\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/reachsense-page-test.txt >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$REACHSENSE_PAGE_CHECK_EXIT" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          message = Path('/tmp/reachsense-page-test.txt').read_text(errors='replace')[-12000:]
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Static Pages browser diagnostic::' + message)
          PY
          fi
          exit "$REACHSENSE_PAGE_CHECK_EXIT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete app
        id: deployment
        uses: actions/deploy-pages@v4
