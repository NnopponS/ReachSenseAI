name: Web workbench verification
on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r scripts/feasibility/requirements.txt
      - run: python -m unittest discover -s python_tests -v
      - run: node --test workbench/tests/*.test.js
      - run: npm --prefix workbench ci
      - name: Install browser for UI checks
        working-directory: workbench
        run: npx playwright install --with-deps chromium
      - name: Exercise Web workflow
        shell: bash
        run: |
          python -m workbench.server --port 8000 > /tmp/reachsense-web.log 2>&1 &
          REACHSENSE_SERVER_PID=$!
          trap 'kill "$REACHSENSE_SERVER_PID"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit('Web server did not become ready')
          PY
          node workbench/tests/browser-smoke.mjs
