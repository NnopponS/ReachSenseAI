name: RGB web and Pages
on:
  push:
    branches: [main, develop/rgb-web]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rgb-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: google-chrome --version
      - run: npm test && npm run browser-test
        working-directory: web
        env:
          REACHSENSE_BROWSER_CHANNEL: chrome
  # The complete site is deployed by pages.yml. Keep this workflow for RGB checks.
